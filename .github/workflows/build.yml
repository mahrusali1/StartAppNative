name: Build StartAppNative

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Check project
        run: |
          echo "=== Project ==="
          ls -la
          echo "=== lib ==="
          ls -la lib
          echo "=== lib/deps ==="
          ls -la lib/deps

      - name: Build Extension
        run: ant extensions

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: StartAppNative-AIX
          path: out/*.aix
