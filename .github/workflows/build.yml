name: Build UnityAds

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Check repository structure
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== lib ==="
          ls -la lib

          echo "=== lib/appinventor ==="
          ls -la lib/appinventor

          echo "=== lib/deps ==="
          ls -la lib/deps

          echo "=== src ==="
          find src -type f

      - name: Build Extension
        run: ant extensions

      - name: Check AIX
        run: |
          echo "=== OUT ==="
          ls -lah out

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: UnityAds-AIX
          path: out/*.aix
          if-no-files-found: error
